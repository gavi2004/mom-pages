<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Galería Modal</title>
  <style>
    /* Estilos del botón */
    #openGalleryBtn {
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }

    /* Fondo oscuro del modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.8);
    }

    /* Contenido del modal */
    .modal-content {
      margin: 5% auto;
      padding: 20px;
      background-color: white;
      width: 80%;
      max-width: 800px;
      border-radius: 8px;
    }

    /* Galería de imágenes */
    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .gallery img {
      width: 150px;
      height: auto;
      border-radius: 4px;
      transition: transform 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    /* Botón de cerrar */
    .close {
      float: right;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <button id="openGalleryBtn">Abrir Galería</button>

  <div id="galleryModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>Galería de Imágenes</h2>
      <div class="gallery">
        <img src="https://via.placeholder.com/150" alt="Imagen 1">
        <img src="https://via.placeholder.com/150" alt="Imagen 2">
        <img src="https://via.placeholder.com/150" alt="Imagen 3">
        <img src="https://via.placeholder.com/150" alt="Imagen 4">
      </div>
    </div>
  </div>

  <script>
    const modal = document.getElementById("galleryModal");
    const btn = document.getElementById("openGalleryBtn");
    const span = document.querySelector(".close");

    btn.onclick = function() {
      modal.style.display = "block";
    }

    span.onclick = function() {
      modal.style.display = "none";
    }

    window.onclick = function(event) {
      if (event.target === modal) {
        modal.style.display = "none";
      }
    }
  </script>

</body>
</html>
